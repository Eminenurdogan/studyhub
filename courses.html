<!doctype html>

    <meta name="description" content="StudyHub ders yönetimi çalışma alanı." />
    <title>Dersler | StudyHub</title>
    <link rel="stylesheet" href="assets/css/style.css" />

          <div class="sidebar-navigation-group">
            <ul class="sidebar-navigation-list">
              <li><a href="dashboard.html" class="sidebar-navigation-item"><svg class="sidebar-navigation-icon" aria-hidden="true"><use href="assets/icons/dashboard-nav.svg#today"></use></svg><span>Bugün</span></a></li>

              <li><a href="analytics.html" class="sidebar-navigation-item"><svg class="sidebar-navigation-icon" aria-hidden="true"><use href="assets/icons/dashboard-nav.svg#analytics"></use></svg><span>Analiz</span></a></li>

            <ul class="sidebar-navigation-list">

              <li><a href="settings.html" class="sidebar-navigation-item"><svg class="sidebar-navigation-icon" aria-hidden="true"><use href="assets/icons/dashboard-nav.svg#settings"></use></svg><span>Ayarlar</span></a></li>
            </ul>
          </div>
        </nav>

            <span class="sidebar-profile-name">Kullanıcı</span>
            <span class="sidebar-profile-label">Öğrenci</span>
          </div>
        </div>

            <button type="button" class="sidebar-menu-button" aria-label="Navigasyon menüsünü aç" aria-controls="appSidebar" aria-expanded="false">

            <div class="dashboard-page-identity">
              <h1>Dersler</h1>
            </div>
