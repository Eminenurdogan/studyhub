<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>StudyHub</title>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="logo">
          <img
            src="assets/images/studyhub-logo.png"
            alt="StudyHub Logo"
            class="logo-icon"
          />

          <h1>StudyHub</h1>
        </div>

        <div class="header-actions">
          <button class="login-btn">Giriş Yap</button>
          <button class="register-btn">Kayıt Ol</button>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <div class="hero-text">
              <h2>Her gün ne yapacağını düşünme. Çalışmaya başla.</h2>

              <p>
                Görevlerini planla, çalışma rutinini oluştur ve ilerlemeni tek
                bir platformdan takip et.
              </p>
              <div class="hero-buttons">
                <button class="primary-btn">Hemen Başla</button>

                <button class="secondary-btn">Özellikleri Keşfet</button>
              </div>
            </div>
            <div class="hero-image">
              <div class="preview-card"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
