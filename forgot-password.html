<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Şifremi Unuttum | StudyHub</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="auth-page">
    <header class="header">
      <div class="container">
        <a href="index.html" class="logo studyhub-brand" aria-label="StudyHub ana sayfa">
          <img
            src="assets/images/studyhub-logo.png"
            alt=""
            class="logo-icon studyhub-brand__mark"
          />
          <span class="studyhub-brand__name">StudyHub</span>
        </a>
      </div>
    </header>

    <main>
      <section class="login-container">
        <div class="login-header">
          <h2>Şifreni Sıfırla</h2>
          <p>
            Hesabına bağlı e-posta adresini gir. Sıfırlama adımlarını sana
            iletelim.
          </p>
        </div>

        <form class="login-form" id="forgotPasswordForm" novalidate>
          <div class="form-group">
            <label for="resetEmail">E-posta</label>
            <input
              type="email"
              id="resetEmail"
              name="email"
              autocomplete="email"
              placeholder="ornek@mail.com"
              required
            />
            <p class="error-message" id="resetEmailError"></p>
          </div>

          <p class="password-reset-feedback" id="resetFeedback" role="status" hidden></p>
          <button type="submit" class="login-button">Sıfırlama Bağlantısı Gönder</button>
          <p class="register-text">
            Şifreni hatırladın mı?
            <a href="login.html">Giriş Yap</a>
          </p>
        </form>
      </section>
    </main>

    <script src="assets/js/forgot-password.js"></script>
  </body>
</html>
